name: Run Context-Aware Framework

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas kagglehub

      - name: Run the framework
        run: python framework-decision.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: framework-results
          path: output_results.txt
